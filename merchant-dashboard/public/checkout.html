<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose your plan - API Blockchain</title>
    <meta name="robots" content="noindex">
    <script>
        // Plans are bought from the dashboard (/plans) and paid in APIUSD; the price is set by
        // the server. Old links (checkout.html?plan=professional&price=29.99) land here.
        (function () {
            var plan = new URLSearchParams(window.location.search).get('plan');
            window.location.replace('/plans' + (plan ? '?plan=' + encodeURIComponent(plan) : ''));
        })();
    </script>
</head>
<body>
    <p><a href="/plans">Continue to plans</a></p>
</body>
</html>
